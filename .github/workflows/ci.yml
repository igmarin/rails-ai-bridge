name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        rails: ["7.1", "7.2", "8.0", "8.1"]
        exclude:
          - ruby: "3.2"
            rails: "8.0"
          - ruby: "3.2"
            rails: "8.1"
        include:
          # Ruby 4.0 compatibility canary on newest Rails. Non-blocking.
          - ruby: "4.0"
            rails: "8.1"
            canary: true

    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}${{ matrix.canary && ' (canary)' || '' }}
    continue-on-error: ${{ matrix.canary == true }}

    env:
      RAILS_VERSION: ${{ matrix.rails }}
      COVERAGE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop --parallel
        if: matrix.ruby == '3.3' && matrix.rails == '8.0'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --parallel

      - name: Reek
        run: bundle exec rake quality:reek

      - name: YARD documentation coverage
        run: bundle exec rake docs:yard

  quality:
    needs: [test]
    runs-on: ubuntu-latest
    env:
      RAILS_VERSION: "8.1"
      COVERAGE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run full suite for quality metrics
        run: bundle exec rspec

      - name: Collect quality metrics
        run: |
          bundle exec reek lib/ --format json > reek.json
          bundle exec yard stats --list-undoc > yard.txt 2>&1
          bundle exec ruby -rjson -e '
            resultset = JSON.parse(File.read("coverage/.resultset.json"))
            coverage_data = resultset.values.first&.fetch("coverage", {})
            coverage = (coverage_data || {}).values
            lines = coverage.flat_map { |file| file.fetch("lines") }.compact
            branches = coverage.flat_map { |file| file.fetch("branches", {}).values.flat_map(&:values) }
            line_percent = lines.count { |count| count.to_i.positive? }.fdiv(lines.size) * 100
            branch_percent = branches.count { |count| count.to_i.positive? }.fdiv(branches.size) * 100
            reek = JSON.parse(File.read("reek.json"))
            yard = File.read("yard.txt")[/([0-9]+(?:\.[0-9]+)?)% documented/, 1]
            summary = [
              "## Quality metrics",
              "- Line coverage: %.2f%%" % line_percent,
              "- Branch coverage: %.2f%%" % branch_percent,
              "- Reek warnings: %d" % reek.size,
              "- YARD documentation: %s%%" % (yard || "unavailable")
            ]
            puts summary.join("\\n")
            File.open(ENV.fetch("GITHUB_STEP_SUMMARY", "quality-summary.md"), "a") { |file| file.puts(summary.join("\\n")) }
          '

  perf:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      RAILS_VERSION: "8.1"
      PERF: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run perf specs
        run: bundle exec rspec --tag perf

      - name: Compare against perf baseline
        run: bundle exec rake perf:compare

      - name: Upload perf baseline artifact
        uses: actions/upload-artifact@v7
        with:
          name: perf-baseline
          path: spec/support/perf_baseline.json
          retention-days: 30

  # Blocking SkunkScore average gate. Five recent 4.2/4.3 PR jobs measured
  # 15.93, 15.97, 15.96, 16.18, 15.89 (mean ≈ 15.99). Threshold 20 is ~25%
  # headroom above the 16.18 worst sample so coverage noise does not block.
  skunk:
    needs: [test]
    runs-on: ubuntu-latest
    env:
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run tests for coverage data
        run: bundle exec rspec

      - name: Run Skunk and enforce score threshold
        run: |
          set -o pipefail
          bundle exec skunk lib/ | tee skunk_output.txt
          score=$(grep 'SkunkScore Average:' skunk_output.txt | grep -oE '[0-9]+(\.[0-9]+)?' | tail -1)
          echo "Skunk score average: ${score}"
          awk -v s="$score" 'BEGIN { exit !(s > 20) }' && {
            echo "::error::Skunk score ${score} exceeds threshold of 20"
            exit 1
          } || echo "Skunk score ${score} within threshold (<=20)"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Update bundler-audit advisory database
        run: bundle exec bundle-audit update

      - name: Run bundler-audit
        run: bundle exec bundle-audit check
