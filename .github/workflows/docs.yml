name: Docs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  yard:
    runs-on: ubuntu-latest
    name: Publish YARD docs to GitHub Pages
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Same YARD coverage gate CI runs (>= 90% documented by default).
      - name: Run YARD documentation gate
        run: bundle exec rake docs:yard

      - name: Build YARD docs
        run: bundle exec yard doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/yard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
