version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "rubydex"
    ignore:
      - dependency-name: "rubydex"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "deps"
      - "improvement"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "deps"
      - "improvement"
